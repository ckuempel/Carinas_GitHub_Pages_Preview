<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Screensaver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="screensaver"></canvas>
        <div class="controls">
            <div class="info-panel">
                <h1>Particle Screensaver</h1>
                <p id="particleCount">Particles: 0</p>
                <p id="fps">FPS: 0</p>
            </div>
            <button id="toggleBtn" class="btn">Pause</button>
            <button id="resetBtn" class="btn">Reset</button>
            <button id="fullscreenBtn" class="btn">Fullscreen</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
